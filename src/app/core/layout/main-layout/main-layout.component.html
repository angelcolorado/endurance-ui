<div class="h-screen overflow-hidden flex">

  <!-- ── Sidebar ──────────────────────────────────── -->
  <aside
    class="w-64 bg-slate-900 flex flex-col flex-shrink-0 border-r border-slate-700/40"
    aria-label="Sidebar navigation"
  >
    <!-- Logo -->
    <div class="h-16 flex items-center px-6 border-b border-slate-700/40">
      <span
        class="text-xl font-black tracking-widest text-white uppercase select-none"
        aria-label="EnduranceOps home"
      >
        Endurance<span class="text-blue-500">Ops</span>
      </span>
    </div>

    <!-- Nav links -->
    <nav
      class="flex-1 overflow-y-auto px-3 py-4 space-y-1"
      aria-label="Main navigation"
    >
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive
          #rla="routerLinkActive"
          [class]="getLinkClasses(rla.isActive)"
          [attr.aria-label]="item.label"
          [attr.aria-current]="rla.isActive ? 'page' : null"
        >
          <svg
            class="w-5 h-5 flex-shrink-0"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              [attr.d]="item.iconPath"
            />
          </svg>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <!-- Sidebar footer -->
    <div class="px-6 py-4 border-t border-slate-700/40">
      <p class="text-xs text-slate-600 select-none">EnduranceOps v1.0</p>
    </div>
  </aside>

  <!-- ── Main column ──────────────────────────────── -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Topbar -->
    <header
      class="h-16 bg-slate-800 border-b border-slate-700/40 flex items-center justify-between px-6 flex-shrink-0"
      role="banner"
    >
      <p class="text-slate-400 text-sm font-medium tracking-widest uppercase select-none">
        EnduranceOps
      </p>

      <div class="flex items-center gap-4">
        <!-- User badge -->
        <div class="flex items-center gap-2.5">
          <div
            class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white text-xs font-bold select-none"
            aria-hidden="true"
          >
            OP
          </div>
          <span class="text-slate-300 text-sm font-medium">Operator</span>
        </div>

        <!-- Logout -->
        <button
          type="button"
          (click)="logout()"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-slate-700 hover:bg-slate-600 text-slate-300 hover:text-white text-sm font-medium transition-colors duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
          aria-label="Logout"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75"
            />
          </svg>
          Logout
        </button>
      </div>
    </header>

    <!-- Content area -->
    <main
      class="flex-1 overflow-y-auto p-6 bg-slate-950"
      role="main"
      aria-label="Main content"
    >
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
